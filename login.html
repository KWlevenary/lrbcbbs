<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>登录 · 老弱病残BBS</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lib/supabase-umd.js"></script>
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
</head>
<body>

<header class="main-header">
  <div class="header-inner">
    <a href="index.html" class="brand nav-logo">
      <span class="brand-name">老弱病残BBS</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="boards.html">全部帖子</a>
      <a href="new.html">发帖</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span id="nav-right" class="nav-right"></span>
    </div>
  </div>
</header>

<div class="page" style="max-width:440px;padding-top:3rem;">

  <!-- ============ 登录 / 注册 ============ -->
  <div class="card auth-card" id="auth-card">
    <div class="auth-head">
      <h2 id="title">登录</h2>
      <p class="auth-sub" id="subtitle">欢迎回来</p>
    </div>

    <div id="msg" class="msg" style="display:none;"></div>

    <form id="form">
      <div class="form-group" id="username-group" style="display:none;">
        <label>用户名</label>
        <input id="username" type="text" placeholder="用于显示的名字" maxlength="20" autocomplete="username">
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="password" type="password" required placeholder="至少 6 位" minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">登录</button>
    </form>

    <p class="auth-switch">
      <span id="switch-text">还没有账号？</span>
      <a href="#" id="switch-mode">去注册</a>
    </p>

    <p class="forgot-link-wrap" id="forgot-link-wrap">
      <a href="#" id="forgot-password-link">忘记密码？</a>
    </p>
  </div>

  <!-- ============ 注册验证码卡片 ============ -->
  <div class="card auth-card auth-verify" id="verify-card" style="display:none;">
    <div class="verify-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <div class="verify-pulse"></div>
    </div>

    <h2 class="verify-title">输入验证码</h2>
    <p class="verify-desc">
      我们已向 <strong id="verify-email">你的邮箱</strong> 发送了 6 位验证码。<br>
      请在下方输入以完成注册。
    </p>

    <div class="otp-input-wrap">
      <input type="text" id="otp-input" maxlength="6" placeholder="------" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*">
    </div>

    <div id="otp-msg" class="msg" style="display:none;"></div>

    <div class="verify-actions" style="margin-top:1.5rem;">
      <button class="btn btn-primary" id="verify-otp-btn" type="button">验证并注册</button>
      <button class="btn btn-ghost" id="back-login-btn" type="button">返回登录</button>
    </div>

    <p class="verify-hint" id="resend-hint" style="margin-top:1rem;"></p>
    <button class="btn btn-ghost btn-sm" id="resend-btn" type="button" style="margin-top:0.5rem;">重新发送验证码</button>
  </div>

  <!-- ============ 忘记密码：输入邮箱 ============ -->
  <div class="card auth-card" id="forgot-card" style="display:none;">
    <div class="auth-head">
      <h2>忘记密码</h2>
      <p class="auth-sub">输入注册邮箱，我们会发送验证码</p>
    </div>

    <div id="forgot-msg" class="msg" style="display:none;"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label>邮箱</label>
        <input id="forgot-email" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="forgot-submit">发送验证码</button>
    </form>

    <p class="auth-switch">
      <a href="#" id="forgot-back-login">← 返回登录</a>
    </p>
  </div>

  <!-- ============ 忘记密码：输入验证码 + 新密码 ============ -->
  <div class="card auth-card auth-verify" id="reset-card" style="display:none;">
    <div class="verify-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <div class="verify-pulse"></div>
    </div>

    <h2 class="verify-title">重置密码</h2>
    <p class="verify-desc">
      验证码已发送至 <strong id="reset-email">你的邮箱</strong><br>
      请输入验证码并设置新密码。
    </p>

    <div class="otp-input-wrap">
      <input type="text" id="reset-otp-input" maxlength="6" placeholder="------" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*">
    </div>

    <div class="form-group" style="text-align:left;margin-top:1rem;">
      <label>新密码</label>
      <input id="reset-new-password" type="password" minlength="6" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div class="form-group" style="text-align:left;">
      <label>确认新密码</label>
      <input id="reset-confirm-password" type="password" minlength="6" placeholder="再次输入" autocomplete="new-password">
    </div>

    <div id="reset-msg" class="msg" style="display:none;"></div>

    <div class="verify-actions" style="margin-top:1rem;">
      <button class="btn btn-primary" id="reset-submit-btn" type="button">确认重置</button>
      <button class="btn btn-ghost" id="reset-back-login-btn" type="button">返回登录</button>
    </div>

    <p class="verify-hint" id="reset-resend-hint" style="margin-top:1rem;"></p>
    <button class="btn btn-ghost btn-sm" id="reset-resend-btn" type="button" style="margin-top:0.5rem;">重新发送验证码</button>
  </div>

</div>

<script type="module">
import { supabase } from './assets/supabase.js'
import { $, showMsg } from './assets/app.js'

let mode = 'login'  // 'login' | 'signup'
let pendingEmail = ''
let resendTimer = null
let resetResendTimer = null

const authCard = $('#auth-card')
const verifyCard = $('#verify-card')
const forgotCard = $('#forgot-card')
const resetCard = $('#reset-card')
const titleEl = $('#title')
const subtitleEl = $('#subtitle')
const switchText = $('#switch-text')
const switchMode = $('#switch-mode')
const usernameGroup = $('#username-group')
const submitBtn = $('#submit-btn')
const msg = $('#msg')
const form = $('#form')

const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html'

// 已登录直接跳转
const { data: { user } } = await supabase.auth.getUser()
if (user) location.href = redirect

// ============ 显示/隐藏工具 ============
function showCard(card) {
  authCard.style.display = 'none'
  verifyCard.style.display = 'none'
  forgotCard.style.display = 'none'
  resetCard.style.display = 'none'
  card.style.display = 'block'
}

// ============ 切换登录/注册 ============
switchMode.onclick = (e) => {
  e.preventDefault()
  mode = mode === 'login' ? 'signup' : 'login'
  const isSignup = mode === 'signup'
  titleEl.textContent = isSignup ? '注册' : '登录'
  subtitleEl.textContent = isSignup ? '创建一个新账号' : '欢迎回来'
  submitBtn.textContent = isSignup ? '注册' : '登录'
  switchText.textContent = isSignup ? '已有账号？' : '还没有账号？'
  switchMode.textContent = isSignup ? '去登录' : '去注册'
  usernameGroup.style.display = isSignup ? 'block' : 'none'
  $('#forgot-link-wrap').style.display = isSignup ? 'none' : 'block'
  $('#password').setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password')
  msg.style.display = 'none'
}

// ============ 提交（登录 / 注册） ============
form.onsubmit = async (e) => {
  e.preventDefault()
  submitBtn.disabled = true
  const orig = submitBtn.textContent
  submitBtn.textContent = '处理中…'

  const email = $('#email').value.trim()
  const password = $('#password').value

  try {
    if (mode === 'signup') {
      const username = $('#username').value.trim() || 'user_' + Math.random().toString(36).slice(2, 8)

      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: { data: { username } }
      })
      if (error) throw error

      if (data.session) {
        showMsg(msg, '注册成功，正在跳转…', 'success')
        setTimeout(() => location.href = redirect, 800)
      } else {
        pendingEmail = email
        $('#verify-email').textContent = email
        showCard(verifyCard)
        $('#otp-input').value = ''
        $('#otp-msg').style.display = 'none'
        $('#resend-hint').textContent = ''
        resetResendBtn()
        submitBtn.disabled = false
        submitBtn.textContent = orig
        setTimeout(() => $('#otp-input').focus(), 150)
      }
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) throw error
      showMsg(msg, '登录成功，正在跳转…', 'success')
      setTimeout(() => location.href = redirect, 500)
    }
  } catch (err) {
    let text = err.message || '操作失败'
    if (text.includes('Email not confirmed')) text = '邮箱尚未验证，请到邮箱获取验证码后再登录'
    else if (text.includes('Invalid login credentials')) text = '邮箱或密码错误'
    else if (text.includes('User already registered')) text = '该邮箱已注册，请直接登录'
    else if (text.includes('Password should be at least')) text = '密码至少 6 位'

    showMsg(msg, text, 'error')
    submitBtn.disabled = false
    submitBtn.textContent = orig
  }
}

// ============================================================
// 注册验证码
// ============================================================
const otpInput = $('#otp-input')
otpInput.addEventListener('input', () => {
  otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 6)
  if (otpInput.value.length === 6) verifyOtp()
})
otpInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); verifyOtp() }
})

async function verifyOtp() {
  const token = otpInput.value.trim()
  const otpMsg = $('#otp-msg')
  const btn = $('#verify-otp-btn')

  if (token.length !== 6 || !/^\d+$/.test(token)) {
    showMsg(otpMsg, '请输入 6 位数字验证码', 'error')
    return
  }
  if (btn.disabled) return

  btn.disabled = true
  btn.textContent = '验证中…'

  try {
    const { data, error } = await supabase.auth.verifyOtp({
      email: pendingEmail,
      token: token,
      type: 'signup'
    })
    if (error) throw error

    if (data.session) {
      showMsg(otpMsg, '验证成功，正在跳转…', 'success')
      setTimeout(() => location.href = redirect, 800)
    } else {
      showMsg(otpMsg, '验证成功，请返回登录', 'success')
      setTimeout(() => backToLogin(), 1000)
    }
  } catch (err) {
    let text = err.message || '验证失败'
    if (text.includes('Token has expired') || text.toLowerCase().includes('invalid')) {
      text = '验证码错误或已过期，请重新获取'
    }
    showMsg(otpMsg, text, 'error')
    btn.disabled = false
    btn.textContent = '验证并注册'
    otpInput.focus()
    otpInput.select()
  }
}
$('#verify-otp-btn').onclick = verifyOtp

// ============ 注册重发（带 60 秒倒计时） ============
function resetResendBtn() {
  const btn = $('#resend-btn')
  if (resendTimer) { clearInterval(resendTimer); resendTimer = null }
  btn.disabled = false
  btn.textContent = '重新发送验证码'
}

$('#resend-btn').onclick = async () => {
  if (!pendingEmail) return
  const btn = $('#resend-btn')
  const hint = $('#resend-hint')
  btn.disabled = true
  btn.textContent = '发送中…'

  try {
    const { error } = await supabase.auth.resend({ type: 'signup', email: pendingEmail })
    if (error) throw error

    hint.textContent = '✓ 验证码已重新发送，请查收'
    hint.style.color = 'var(--primary-light)'
    let countdown = 60
    resendTimer = setInterval(() => {
      countdown--
      btn.textContent = `重新发送 (${countdown}s)`
      if (countdown <= 0) {
        clearInterval(resendTimer); resendTimer = null
        btn.disabled = false
        btn.textContent = '重新发送验证码'
      }
    }, 1000)
  } catch (err) {
    hint.textContent = '✗ ' + (err.message || '发送失败')
    hint.style.color = '#f87171'
    btn.disabled = false
    btn.textContent = '重新发送验证码'
  }
}

// ============ 返回登录 ============
function backToLogin() {
  showCard(authCard)
  mode = 'login'
  titleEl.textContent = '登录'
  subtitleEl.textContent = '欢迎回来'
  submitBtn.textContent = '登录'
  switchText.textContent = '还没有账号？'
  switchMode.textContent = '去注册'
  usernameGroup.style.display = 'none'
  $('#forgot-link-wrap').style.display = 'block'
  form.reset()
  msg.style.display = 'none'
  resetResendBtn()
}
$('#back-login-btn').onclick = backToLogin

// ============================================================
// 忘记密码
// ============================================================
let resetEmail = ''

// 显示"忘记密码"卡片
$('#forgot-password-link').onclick = (e) => {
  e.preventDefault()
  $('#forgot-email').value = $('#email').value.trim()
  $('#forgot-msg').style.display = 'none'
  showCard(forgotCard)
  setTimeout(() => $('#forgot-email').focus(), 150)
}

// 返回登录
$('#forgot-back-login').onclick = (e) => {
  e.preventDefault()
  backToLogin()
}

// 发送重置验证码
$('#forgot-form').onsubmit = async (e) => {
  e.preventDefault()
  const btn = $('#forgot-submit')
  const email = $('#forgot-email').value.trim()
  const forgotMsg = $('#forgot-msg')

  if (!email) {
    showMsg(forgotMsg, '请输入邮箱', 'error')
    return
  }

  btn.disabled = true
  btn.textContent = '发送中…'

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email)
    if (error) throw error

    resetEmail = email
    $('#reset-email').textContent = email
    showCard(resetCard)
    $('#reset-otp-input').value = ''
    $('#reset-new-password').value = ''
    $('#reset-confirm-password').value = ''
    $('#reset-msg').style.display = 'none'
    $('#reset-resend-hint').textContent = ''
    resetResetResendBtn()
    setTimeout(() => $('#reset-otp-input').focus(), 150)
  } catch (err) {
    let text = err.message || '发送失败'
    if (text.toLowerCase().includes('user not found')) text = '该邮箱未注册'
    showMsg(forgotMsg, text, 'error')
  }

  btn.disabled = false
  btn.textContent = '发送验证码'
}

// 重置验证码输入
const resetOtpInput = $('#reset-otp-input')
resetOtpInput.addEventListener('input', () => {
  resetOtpInput.value = resetOtpInput.value.replace(/\D/g, '').slice(0, 6)
})

// 重置密码提交
$('#reset-submit-btn').onclick = async () => {
  const btn = $('#reset-submit-btn')
  const token = resetOtpInput.value.trim()
  const pwd = $('#reset-new-password').value
  const pwd2 = $('#reset-confirm-password').value
  const resetMsg = $('#reset-msg')

  if (token.length !== 6 || !/^\d+$/.test(token)) {
    showMsg(resetMsg, '请输入 6 位数字验证码', 'error')
    return
  }
  if (!pwd || pwd.length < 6) {
    showMsg(resetMsg, '新密码至少 6 位', 'error')
    return
  }
  if (pwd !== pwd2) {
    showMsg(resetMsg, '两次输入的密码不一致', 'error')
    return
  }

  btn.disabled = true
  btn.textContent = '重置中…'

  try {
    // 1. 先用验证码换取恢复会话
    const { data, error } = await supabase.auth.verifyOtp({
      email: resetEmail,
      token: token,
      type: 'recovery'
    })
    if (error) throw error
    if (!data.session) throw new Error('验证码验证失败')

    // 2. 更新密码
    const { error: updateErr } = await supabase.auth.updateUser({ password: pwd })
    if (updateErr) throw updateErr

    showMsg(resetMsg, '✓ 密码已重置，正在跳转…', 'success')
    setTimeout(() => location.href = redirect, 900)
  } catch (err) {
    let text = err.message || '重置失败'
    if (text.includes('Token has expired') || text.toLowerCase().includes('invalid')) {
      text = '验证码错误或已过期，请重新获取'
    } else if (text.includes('same as the old password') || text.includes('New password should be different')) {
      text = '新密码不能与旧密码相同'
    }
    showMsg(resetMsg, text, 'error')
    btn.disabled = false
    btn.textContent = '确认重置'
  }
}

// 重置密码重发（带 60 秒倒计时）
function resetResetResendBtn() {
  const btn = $('#reset-resend-btn')
  if (resetResendTimer) { clearInterval(resetResendTimer); resetResendTimer = null }
  btn.disabled = false
  btn.textContent = '重新发送验证码'
}

$('#reset-resend-btn').onclick = async () => {
  if (!resetEmail) return
  const btn = $('#reset-resend-btn')
  const hint = $('#reset-resend-hint')
  btn.disabled = true
  btn.textContent = '发送中…'

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(resetEmail)
    if (error) throw error

    hint.textContent = '✓ 验证码已重新发送，请查收'
    hint.style.color = 'var(--primary-light)'
    let countdown = 60
    resetResendTimer = setInterval(() => {
      countdown--
      btn.textContent = `重新发送 (${countdown}s)`
      if (countdown <= 0) {
        clearInterval(resetResendTimer); resetResendTimer = null
        btn.disabled = false
        btn.textContent = '重新发送验证码'
      }
    }, 1000)
  } catch (err) {
    hint.textContent = '✗ ' + (err.message || '发送失败')
    hint.style.color = '#f87171'
    btn.disabled = false
    btn.textContent = '重新发送验证码'
  }
}

// 返回登录
$('#reset-back-login-btn').onclick = () => {
  resetEmail = ''
  backToLogin()
}
</script>
</body>
</html>
