<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>管理面板 · 老弱病残BBS</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lib/supabase-umd.js"></script>
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
<style>
/* ============================================================
   管理面板专用样式
   ============================================================ */
.admin-wrap { padding: 1.2rem 1.5rem 3rem; max-width: 1400px; margin: 0 auto; }

.admin-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 1.2rem;
  align-items: start;
}

/* 左侧导航 */
.admin-sidebar {
  position: sticky;
  top: 84px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0.7rem;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--card-shadow);
}

.admin-sidebar-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.6rem 0.7rem 0.8rem;
  font-weight: 800;
  font-size: 1rem;
  color: var(--text-strong);
  border-bottom: 1px solid var(--border);
  margin-bottom: 0.5rem;
}

.admin-nav { display: flex; flex-direction: column; gap: 0.2rem; }

.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.65rem 0.85rem;
  border-radius: 10px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s var(--ease);
  width: 100%;
}

.admin-nav-item:hover {
  background: var(--card-bg-hover);
  color: var(--text-strong);
  border-color: var(--border);
}

.admin-nav-item.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 16px -8px rgba(20, 184, 166, 0.7);
}

.admin-nav-icon { font-size: 1.1rem; line-height: 1; flex-shrink: 0; }

.admin-sidebar-foot {
  margin-top: 0.6rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--border);
}

/* 右侧内容区 */
.admin-main { min-width: 0; }

.admin-page { display: none; animation: adminPageIn 0.25s var(--ease); }
.admin-page.active { display: block; }

@keyframes adminPageIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.admin-page-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  padding-left: 0.9rem;
  position: relative;
}
.admin-page-head::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 22px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  box-shadow: 0 0 12px rgba(20, 184, 166, 0.6);
}
.admin-page-head h2 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text-strong);
  margin: 0;
}
.admin-page-head .admin-page-sub {
  font-size: 0.82rem;
  color: var(--text-muted);
}

/* 概览：统计卡片网格 */
.admin-overview-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.9rem;
  margin-bottom: 1.2rem;
}

.admin-stat-card {
  padding: 1.2rem 1.3rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--card-shadow);
  position: relative;
  overflow: hidden;
  transition: all 0.3s var(--ease);
}
.admin-stat-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-hover);
  background: var(--card-bg-hover);
}

.admin-stat-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.5rem;
}
.admin-stat-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 500;
}
.admin-stat-icon {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  background: rgba(20, 184, 166, 0.12);
  color: var(--primary-light);
}
.admin-stat-value {
  font-size: 1.9rem;
  font-weight: 800;
  color: var(--text-strong);
  line-height: 1.1;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 图表卡片 */
.admin-chart-card {
  padding: 1.3rem 1.4rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--card-shadow);
  margin-bottom: 1.2rem;
}
.admin-chart-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-strong);
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.admin-chart-title .sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 500;
}

.admin-chart-bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.6rem;
  align-items: end;
  height: 140px;
}
.admin-chart-bar {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 0.35rem;
  height: 100%;
}
.admin-chart-bar-fill {
  width: 100%;
  max-width: 40px;
  border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, var(--primary-light), var(--primary-dark));
  min-height: 4px;
  transition: height 0.5s var(--ease);
  position: relative;
}
.admin-chart-bar-fill:hover { filter: brightness(1.15); }
.admin-chart-bar-value {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--primary-light);
}
.admin-chart-bar-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  white-space: nowrap;
}

/* 卡片式列表通用 */
.admin-list { display: flex; flex-direction: column; gap: 0.55rem; }
.admin-card-row {
  padding: 0.9rem 1.1rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  transition: all 0.25s var(--ease);
}
.admin-card-row:hover {
  background: var(--card-bg-hover);
  border-color: var(--border-hover);
}

/* 工具条 */
.admin-toolbar {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.admin-search {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
  min-width: 200px;
  padding: 0 0.9rem;
  height: 40px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: all 0.25s var(--ease);
}
.admin-search:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.12);
}
.admin-search svg {
  width: 16px; height: 16px;
  stroke: var(--text-muted);
  flex-shrink: 0;
}
.admin-search input {
  flex: 1;
  background: transparent;
  border: none;
  padding: 0;
  color: var(--text);
  font-family: inherit;
  font-size: 0.92rem;
  outline: none;
  height: auto;
  min-height: auto;
  box-shadow: none;
}

.admin-pill {
  font-size: 0.78rem;
  color: var(--text-muted);
  padding: 0.35rem 0.8rem;
  border-radius: 999px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  white-space: nowrap;
}

/* 移动端回退：小于 1024px 时用原来的垂直布局 */
@media (max-width: 1023px) {
  .admin-layout {
    grid-template-columns: 1fr;
  }
  .admin-sidebar {
    position: static;
    padding: 0.5rem;
  }
  .admin-sidebar-brand { display: none; }
  .admin-nav {
    flex-direction: row;
    overflow-x: auto;
    gap: 0.4rem;
    padding-bottom: 0.2rem;
    -webkit-overflow-scrolling: touch;
  }
  .admin-nav::-webkit-scrollbar { display: none; }
  .admin-nav-item {
    flex-shrink: 0;
    padding: 0.55rem 0.9rem;
    font-size: 0.85rem;
    width: auto;
  }
  .admin-sidebar-foot { display: none; }
  .admin-overview-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 520px) {
  .admin-overview-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .admin-stat-card { padding: 0.9rem 1rem; }
  .admin-stat-value { font-size: 1.4rem; }
  .admin-stat-icon { width: 28px; height: 28px; font-size: 0.95rem; }
  .admin-chart-bars { gap: 0.3rem; }
  .admin-chart-bar-value { font-size: 0.68rem; }
}
</style>
</head>

<script type="module">
import { supabase } from './assets/supabase.js'
import { renderNav, escapeHtml, formatTime, initial, bindCardGlow } from './assets/app.js'
import { requireAdmin } from './assets/admin.js'

renderNav()
const me = await requireAdmin()
if (!me) throw new Error('not admin')

// ============================================================
// 导航切换
// ============================================================
const navItems = document.querySelectorAll('.admin-nav-item[data-page]')
const pages = document.querySelectorAll('.admin-page')
let currentPage = 'dashboard'
let loaded = { dashboard: false, posts: false, users: false, comments: false, announcements: false, invites: false }

navItems.forEach(item => {
  item.onclick = () => {
    const pageName = item.dataset.page
    if (pageName === currentPage) return
    currentPage = pageName

    navItems.forEach(i => i.classList.toggle('active', i === item))
    pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + pageName))

    if (!loaded[pageName]) {
      loaded[pageName] = true
      if (pageName === 'dashboard') loadDashboard()
      else if (pageName === 'posts') loadPosts()
      else if (pageName === 'users') loadUsers()
      else if (pageName === 'comments') loadComments()
      else if (pageName === 'announcements') loadAnnouncements()
      else if (pageName === 'invites') loadInvites()
    }
  }
})

// ============================================================
// 概览
// ============================================================
async function loadDashboard() {
  const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0)

  const [
    { count: postCount },
    { count: userCount },
    { count: commentCount },
    { count: todayCount },
    { count: checkinCount },
    { data: woodSum }
  ] = await Promise.all([
    supabase.from('posts').select('*', { count: 'exact', head: true }),
    supabase.from('profiles').select('*', { count: 'exact', head: true }),
    supabase.from('comments').select('*', { count: 'exact', head: true }),
    supabase.from('posts').select('*', { count: 'exact', head: true }).gte('created_at', todayStart.toISOString()),
    supabase.from('checkins').select('*', { count: 'exact', head: true }),
    supabase.from('profiles').select('rolling_wood')
  ])

  const totalWood = (woodSum || []).reduce((s, x) => s + (x.rolling_wood || 0), 0)

  document.getElementById('ov-posts').textContent = postCount ?? 0
  document.getElementById('ov-users').textContent = userCount ?? 0
  document.getElementById('ov-comments').textContent = commentCount ?? 0
  document.getElementById('ov-today').textContent = todayCount ?? 0
  document.getElementById('ov-checkins').textContent = checkinCount ?? 0
  document.getElementById('ov-wood').textContent = totalWood

  // 最近 7 天发帖
  const days = []
  for (let i = 6; i >= 0; i--) {
    const d = new Date()
    d.setHours(0, 0, 0, 0)
    d.setDate(d.getDate() - i)
    const next = new Date(d)
    next.setDate(next.getDate() + 1)
    days.push({ start: d, end: next, label: (d.getMonth() + 1) + '/' + d.getDate() })
  }

  const counts = await Promise.all(days.map(day =>
    supabase.from('posts').select('*', { count: 'exact', head: true })
      .gte('created_at', day.start.toISOString())
      .lt('created_at', day.end.toISOString())
      .then(r => r.count || 0)
  ))

  const maxCount = Math.max(1, ...counts)
  const bars = document.getElementById('chart-bars')
  bars.innerHTML = days.map((day, i) => {
    const c = counts[i]
    const heightPct = Math.round((c / maxCount) * 100)
    return `
      <div class="admin-chart-bar">
        <div class="admin-chart-bar-fill" style="height:${heightPct}%"></div>
        <div class="admin-chart-bar-value">${c}</div>
        <div class="admin-chart-bar-label">${day.label}</div>
      </div>
    `
  }).join('')

  document.getElementById('chart-sub').textContent = '总计 ' + counts.reduce((a, b) => a + b, 0) + ' 篇'
}

const POST_PAGE_SIZE = 8
let allPosts = []
let filteredPosts = []
let postPage = 1
let postKeyword = ''

async function loadPosts() {
  const box = document.getElementById('post-list')
  box.innerHTML = '<div class="empty">加载中…</div>'

  const { data, error } = await supabase
    .from('posts')
    .select('id, title, created_at, author_id, tags_major, tags_minor, profiles!author_id(username)')
    .order('created_at', { ascending: false })

  if (error) {
    box.innerHTML = '<div class="empty">加载失败：' + escapeHtml(error.message) + '</div>'
    return
  }
  allPosts = data || []
  applyPostFilter()
}

function applyPostFilter() {
  const kw = postKeyword.toLowerCase().trim()
  filteredPosts = !kw ? allPosts.slice() : allPosts.filter(p => {
    const title = (p.title || '').toLowerCase()
    const author = ((p.profiles && p.profiles.username) || '').toLowerCase()
    return title.indexOf(kw) !== -1 || author.indexOf(kw) !== -1
  })
  postPage = 1
  renderPosts()
}

function renderPosts() {
  const box = document.getElementById('post-list')
  document.getElementById('post-count').textContent = filteredPosts.length + ' 条'

  if (!filteredPosts.length) {
    box.innerHTML = '<div class="empty">' + (postKeyword ? '没有匹配的帖子' : '暂无帖子') + '</div>'
    document.getElementById('post-pagination').innerHTML = ''
    return
  }

  const totalPages = Math.ceil(filteredPosts.length / POST_PAGE_SIZE)
  const start = (postPage - 1) * POST_PAGE_SIZE
  const items = filteredPosts.slice(start, start + POST_PAGE_SIZE)

  box.innerHTML = items.map(p => {
    const tags = [].concat(p.tags_major || [], p.tags_minor || [])
    return `
      <div class="admin-card-row">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;color:var(--text-strong);margin-bottom:0.2rem;">
            <a href="post.html?id=${p.id}" target="_blank" style="color:inherit;">${escapeHtml(p.title)}</a>
          </div>
          <div style="font-size:0.8rem;color:var(--text-muted);">
            ${escapeHtml((p.profiles && p.profiles.username) || '匿名')} · ${formatTime(p.created_at)}
            ${tags.length ? ' · ' + tags.map(t => '<span class="tag-minor" style="font-size:0.7rem;padding:0.1rem 0.5rem;">' + escapeHtml(t) + '</span>').join(' ') : ''}
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-del-post="${p.id}" style="color:#f87171;">删除</button>
      </div>
    `
  }).join('')

  box.querySelectorAll('[data-del-post]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('确定删除这个帖子？')) return
      const { error } = await supabase.from('posts').delete().eq('id', btn.dataset.delPost)
      if (error) return alert(error.message)
      allPosts = allPosts.filter(x => x.id !== Number(btn.dataset.delPost))
      applyPostFilter()
    }
  })

  renderPostPagination(totalPages)
}

function renderPostPagination(totalPages) {
  const pag = document.getElementById('post-pagination')
  if (totalPages <= 1) { pag.innerHTML = ''; return }

  const parts = []
  parts.push('<button class="page-btn" data-page="prev" ' + (postPage === 1 ? 'disabled' : '') + '>←</button>')

  const pages = []
  const maxShow = 5
  let start = Math.max(1, postPage - 2)
  let end = Math.min(totalPages, start + maxShow - 1)
  if (end - start + 1 < maxShow) start = Math.max(1, end - maxShow + 1)
  if (start > 1) { pages.push(1); if (start > 2) pages.push('…') }
  for (let i = start; i <= end; i++) pages.push(i)
  if (end < totalPages) { if (end < totalPages - 1) pages.push('…'); pages.push(totalPages) }

  pages.forEach(p => {
    if (p === '…') parts.push('<span class="page-ellipsis">…</span>')
    else parts.push('<button class="page-btn ' + (p === postPage ? 'active' : '') + '" data-page="' + p + '">' + p + '</button>')
  })

  parts.push('<button class="page-btn" data-page="next" ' + (postPage === totalPages ? 'disabled' : '') + '>→</button>')
  pag.innerHTML = parts.join('')

  pag.querySelectorAll('.page-btn').forEach(btn => {
    btn.onclick = () => {
      const t = btn.dataset.page
      if (t === 'prev') postPage = Math.max(1, postPage - 1)
      else if (t === 'next') postPage = Math.min(totalPages, postPage + 1)
      else postPage = Number(t)
      renderPosts()
    }
  })
}

      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0.4rem;margin-bottom:1.2rem;">

        <button type="button" class="btn btn-ghost btn-sm" data-quick="100">100</button>

        <button type="button" class="btn btn-ghost btn-sm" data-quick="9999">9999</button>
      </div>
      <div style="display:flex;gap:0.4rem;margin-bottom:1.2rem;">
        <button type="button" class="btn btn-ghost btn-sm" data-add="1" style="flex:1;">+1</button>

        <button type="button" class="btn btn-ghost btn-sm" data-add="100" style="flex:1;">+100</button>
        <button type="button" class="btn btn-ghost btn-sm" data-sub="10" style="flex:1;">-10</button>
      </div>
      <div class="tip-modal-actions">
        <button class="btn btn-ghost" id="wood-cancel">取消</button>
        <button class="btn btn-primary" id="wood-save">保存</button>
      </div>
    </div>
  `
  document.body.appendChild(mask)
  const input = mask.querySelector('#wood-input')
  setTimeout(() => { input.focus(); input.select() }, 100)

  mask.querySelectorAll('[data-quick]').forEach(b => { b.onclick = () => { input.value = b.dataset.quick; input.focus() } })
  mask.querySelectorAll('[data-add]').forEach(b => { b.onclick = () => { input.value = Math.max(0, (Number(input.value) || 0) + Number(b.dataset.add)); input.focus() } })
  mask.querySelectorAll('[data-sub]').forEach(b => { b.onclick = () => { input.value = Math.max(0, (Number(input.value) || 0) - Number(b.dataset.sub)); input.focus() } })

  const close = () => mask.remove()
  mask.querySelector('#wood-cancel').onclick = close
  mask.onclick = (e) => { if (e.target === mask) close() }
  document.addEventListener('keydown', function onEsc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc) } })

  const save = async () => {
    const val = Math.floor(Number(input.value))
    if (!Number.isFinite(val) || val < 0) return alert('请输入有效的数字（≥ 0）')
    if (val > 9999999) return alert('上限 9999999')
    const btn = mask.querySelector('#wood-save')
    btn.disabled = true; btn.textContent = '保存中…'
    const { error } = await supabase.from('profiles').update({ rolling_wood: val }).eq('id', userId)
    if (error) { alert(error.message); btn.disabled = false; btn.textContent = '保存'; return }
    close(); loadUsers()
  }
  mask.querySelector('#wood-save').onclick = save
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save() } })
}

  return 'LR-' + seg(4) + '-' + seg(4) + '-' + seg(4)
}

      <div class="admin-card-row">
        <div style="flex:1;min-width:0;">
          <div style="font-family:ui-monospace,monospace;font-size:1rem;font-weight:600;letter-spacing:0.05em;
                      color:${used ? 'var(--text-muted)' : 'var(--accent)'};${used ? 'text-decoration:line-through;' : ''}">
            ${escapeHtml(inv.code)}
            ${inv.is_permanent ? '<span class="tag" style="margin-left:0.4rem;">永久</span>' : ''}
          </div>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.3rem;">
            ${inv.note ? escapeHtml(inv.note) + ' · ' : ''}${used ? '已于 ' + formatTime(inv.used_at) + ' 使用' : '未使用'}
          </div>
        </div>
        ${used ? '' : '<button class="btn btn-ghost btn-sm" data-copy="' + escapeHtml(inv.code) + '">复制</button>'}
      </div>
    `
  }).join('')

  box.querySelectorAll('[data-copy]').forEach(btn => {
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy)
        btn.textContent = '已复制 ✓'
        setTimeout(() => { btn.textContent = '复制' }, 1500)
      } catch (e) { prompt('复制失败，请手动复制：', btn.dataset.copy) }
    }
  })
}

// ============================================================
// 启动
// ============================================================
loadDashboard()
loaded.dashboard = true
</script>
</body>
</html>
