<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>管理面板 · 老弱病残BBS</title>
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
</head>
<body>

<header class="main-header">
  <div class="header-inner">
    <a href="index.html" class="brand nav-logo">
      <span class="brand-name">老弱病残BBS</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="boards.html">全部帖子</a>
      <a href="new.html">发帖</a>
      <a href="admin.html" class="active">管理</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span id="nav-right" class="nav-right"></span>
    </div>
  </div>
</header>

<div class="page" style="max-width:1200px;">

  <!-- 公告管理 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-left:0.9rem;">
    <h2 style="font-size:1.15rem;font-weight:700;color:var(--text-strong);">📢 公告管理</h2>
    <button class="btn btn-primary btn-sm" id="new-announcement">新增公告</button>
  </div>
  <div id="announcement-admin" style="margin-bottom:2rem;"></div>

  <!-- 统计 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-left:0.9rem;">
    <h2 style="font-size:1.15rem;font-weight:700;color:var(--text-strong);">📊 数据统计</h2>
  </div>
  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:1.5rem;">
    <div class="stat-ball">
      <div class="ball-icon">帖</div>
      <div class="ball-num" id="stat-posts">—</div>
      <div class="ball-label">帖子总数</div>
    </div>
    <div class="stat-ball">
      <div class="ball-icon">用</div>
      <div class="ball-num" id="stat-users">—</div>
      <div class="ball-label">用户总数</div>
    </div>
    <div class="stat-ball">
      <div class="ball-icon">评</div>
      <div class="ball-num" id="stat-comments">—</div>
      <div class="ball-label">评论总数</div>
    </div>
  </div>

  <!-- 帖子管理 -->
  <div class="admin-post-head">
    <h2>📝 所有帖子</h2>
    <div class="admin-post-tools">
      <div class="admin-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="admin-post-search" type="text" placeholder="搜索标题或作者…" autocomplete="off">
        <button id="admin-search-clear" class="admin-search-clear" type="button" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <span id="admin-post-count" class="admin-post-count">—</span>
    </div>
  </div>
  <div id="post-list"></div>
  <div id="post-pagination" class="pagination"></div>

  <!-- 用户管理 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin:2rem 0 1rem;padding-left:0.9rem;">
    <h2 style="font-size:1.15rem;font-weight:700;color:var(--text-strong);">👥 所有用户</h2>
    <span style="font-size:0.82rem;color:var(--text-muted);">可设置 / 取消管理员</span>
  </div>
  <div id="user-list"></div>

  <!-- 邀请码管理 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin:2rem 0 1rem;padding-left:0.9rem;">
    <h2 style="font-size:1.15rem;font-weight:700;color:var(--text-strong);">🎟️ 邀请码管理</h2>
    <button class="btn btn-primary btn-sm" id="gen-invite">生成新邀请码</button>
  </div>
  <div id="invite-list"></div>
</div>

<script type="module">
import { supabase } from './assets/supabase.js'
import { renderNav, escapeHtml, formatTime, initial, bindCardGlow } from './assets/app.js'
import { requireAdmin } from './assets/admin.js'

renderNav()
const me = await requireAdmin()
if (!me) throw new Error('not admin')

// ============================================================
// 帖子列表（分页 5 条 + 搜索）
// ============================================================
const PAGE_SIZE = 5
let allPosts = []         // 全量缓存
let filteredPosts = []    // 过滤后
let currentPage = 1
let searchKeyword = ''

const postListBox = document.getElementById('post-list')
const paginationBox = document.getElementById('post-pagination')
const postCountEl = document.getElementById('admin-post-count')
const searchInput = document.getElementById('admin-post-search')
const searchClearBtn = document.getElementById('admin-search-clear')

async function loadPosts() {
  const { data, error } = await supabase
    .from('posts')
    .select('id, title, created_at, author_id, tags_major, tags_minor, profiles!author_id(username)')
    .order('created_at', { ascending: false })

  if (error) {
    postListBox.innerHTML = `<div class="empty">加载失败：${escapeHtml(error.message)}</div>`
    return
  }

  allPosts = data || []
  applyFilter()
}

function applyFilter() {
  const kw = searchKeyword.toLowerCase().trim()
  if (!kw) {
    filteredPosts = allPosts.slice()
  } else {
    filteredPosts = allPosts.filter(p => {
      const title = (p.title || '').toLowerCase()
      const author = (p.profiles?.username || '').toLowerCase()
      return title.includes(kw) || author.includes(kw)
    })
  }

  currentPage = 1
  renderPosts()
  renderPagination()
}

function renderPosts() {
  postCountEl.textContent = searchKeyword
    ? `找到 ${filteredPosts.length} 条`
    : `共 ${filteredPosts.length} 条`

  if (!filteredPosts.length) {
    postListBox.innerHTML = `<div class="empty">${searchKeyword ? '没有匹配的帖子' : '暂无帖子'}</div>`
    return
  }

  const start = (currentPage - 1) * PAGE_SIZE
  const pageItems = filteredPosts.slice(start, start + PAGE_SIZE)

  postListBox.innerHTML = pageItems.map(p => {
    const tags = [...(p.tags_major || []), ...(p.tags_minor || [])]
    return `
      <div class="card" style="margin-bottom:0.6rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
          <div style="flex:1;min-width:0;">
            <h3 style="font-size:1rem;margin-bottom:0.2rem;">
              <a href="post.html?id=${p.id}" target="_blank" style="color:var(--text-strong);">${escapeHtml(p.title)}</a>
            </h3>
            <div style="font-size:0.8rem;color:var(--text-muted);">
              ${escapeHtml(p.profiles?.username || '匿名')} · ${formatTime(p.created_at)}
              ${tags.length ? ' · ' + tags.map(t => `<span class="tag-minor" style="font-size:0.7rem;padding:0.1rem 0.5rem;">${escapeHtml(t)}</span>`).join(' ') : ''}
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" data-del-post="${p.id}" style="color:#f87171;">删除</button>
        </div>
      </div>
    `
  }).join('')

  bindCardGlow(postListBox)

  postListBox.querySelectorAll('[data-del-post]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('确定删除这个帖子？')) return
      const { error } = await supabase.from('posts').delete().eq('id', btn.dataset.delPost)
      if (error) return alert(error.message)
      // 从缓存中移除
      allPosts = allPosts.filter(x => x.id !== Number(btn.dataset.delPost))
      applyFilter()
      loadStats()
    }
  })
}

function renderPagination() {
  const totalPages = Math.ceil(filteredPosts.length / PAGE_SIZE)

  if (totalPages <= 1) {
    paginationBox.innerHTML = ''
    return
  }

  const parts = []
  parts.push(`<button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>← 上一页</button>`)

  // 生成页码（最多显示 7 个）
  const pages = []
  const maxShow = 7
  let start = Math.max(1, currentPage - Math.floor(maxShow / 2))
  let end = Math.min(totalPages, start + maxShow - 1)
  if (end - start + 1 < maxShow) start = Math.max(1, end - maxShow + 1)

  if (start > 1) {
    pages.push(1)
    if (start > 2) pages.push('…')
  }
  for (let i = start; i <= end; i++) pages.push(i)
  if (end < totalPages) {
    if (end < totalPages - 1) pages.push('…')
    pages.push(totalPages)
  }

  pages.forEach(p => {
    if (p === '…') {
      parts.push(`<span class="page-ellipsis">…</span>`)
    } else {
      parts.push(`<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`)
    }
  })

  parts.push(`<button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>下一页 →</button>`)

  paginationBox.innerHTML = parts.join('')

  paginationBox.querySelectorAll('.page-btn').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.page
      if (target === 'prev') currentPage = Math.max(1, currentPage - 1)
      else if (target === 'next') currentPage = Math.min(totalPages, currentPage + 1)
      else currentPage = Number(target)

      renderPosts()
      renderPagination()
      // 滚到帖子列表顶部
      document.querySelector('.admin-post-head').scrollIntoView({ behavior: 'smooth', block: 'start' })
    }
  })
}

// ============ 搜索 ============
searchInput.addEventListener('input', () => {
  searchKeyword = searchInput.value
  searchClearBtn.style.display = searchKeyword.trim() ? 'flex' : 'none'
  applyFilter()
})

searchClearBtn.onclick = () => {
  searchInput.value = ''
  searchKeyword = ''
  searchClearBtn.style.display = 'none'
  applyFilter()
  searchInput.focus()
}

// ============================================================
// 公告管理
// ============================================================
const annBox = document.getElementById('announcement-admin')

async function loadAnnouncements() {
  const { data, error } = await supabase
    .from('announcements').select('*')
    .order('created_at', { ascending: false })

  if (error || !data?.length) {
    annBox.innerHTML = `<div class="empty">暂无公告</div>`
    return
  }

  annBox.innerHTML = data.map(a => `
    <div class="card" style="margin-bottom:0.6rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;color:var(--text-strong);margin-bottom:0.2rem;">${escapeHtml(a.title)}</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">${formatTime(a.created_at)}</div>
        </div>
        <div style="display:flex;gap:0.4rem;">
          <button class="btn btn-ghost btn-sm" data-ann-edit="${a.id}">编辑</button>
          <button class="btn btn-ghost btn-sm" data-ann-del="${a.id}" style="color:#f87171;">删除</button>
        </div>
      </div>
    </div>
  `).join('')

  bindCardGlow(annBox)

  annBox.querySelectorAll('[data-ann-edit]').forEach(btn => {
    btn.onclick = () => {
      const a = data.find(x => x.id === Number(btn.dataset.annEdit))
      if (a) openAnnEditor(a)
    }
  })
  annBox.querySelectorAll('[data-ann-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('确定删除这条公告？')) return
      const { error } = await supabase.from('announcements').delete().eq('id', btn.dataset.annDel)
      if (error) return alert(error.message)
      loadAnnouncements()
    }
  })
}

document.getElementById('new-announcement').onclick = () => openAnnEditor()

function openAnnEditor(a = null) {
  const isEdit = !!a
  const mask = document.createElement('div')
  mask.className = 'tip-modal-mask'
  mask.innerHTML = `
    <div class="tip-modal" style="max-width:640px;">
      <h3>${isEdit ? '编辑公告' : '新增公告'}</h3>
      <div style="margin-top:1rem;">
        <div class="form-group">
          <label>标题</label>
          <input id="ann-title" type="text" maxlength="100" value="${isEdit ? escapeHtml(a.title) : ''}">
        </div>
        <div class="form-group">
          <label>正文（支持 **粗体** 和换行）</label>
          <textarea id="ann-content" style="min-height:200px;">${isEdit ? escapeHtml(a.content) : ''}</textarea>
        </div>
      </div>
      <div class="tip-modal-actions">
        <button class="btn btn-ghost" id="ann-cancel">取消</button>
        <button class="btn btn-primary" id="ann-save">保存</button>
      </div>
    </div>
  `
  document.body.appendChild(mask)

  mask.querySelector('#ann-cancel').onclick = () => mask.remove()
  mask.onclick = (e) => { if (e.target === mask) mask.remove() }

  mask.querySelector('#ann-save').onclick = async () => {
    const title = mask.querySelector('#ann-title').value.trim()
    const content = mask.querySelector('#ann-content').value.trim()
    if (!title || !content) return alert('标题和内容不能为空')

    const btn = mask.querySelector('#ann-save')
    btn.disabled = true
    btn.textContent = '保存中…'

    let error
    if (isEdit) {
      ({ error } = await supabase.from('announcements')
        .update({ title, content, updated_at: new Date().toISOString() })
        .eq('id', a.id))
    } else {
      ({ error } = await supabase.from('announcements').insert({ title, content }))
    }

    if (error) {
      alert(error.message)
      btn.disabled = false
      btn.textContent = '保存'
      return
    }
    mask.remove()
    loadAnnouncements()
  }
}

// ============================================================
// 统计
// ============================================================
async function loadStats() {
  const { count: pCount } = await supabase.from('posts').select('*', { count: 'exact', head: true })
  const { count: uCount } = await supabase.from('profiles').select('*', { count: 'exact', head: true })
  const { count: cCount } = await supabase.from('comments').select('*', { count: 'exact', head: true })
  document.getElementById('stat-posts').textContent = pCount ?? 0
  document.getElementById('stat-users').textContent = uCount ?? 0
  document.getElementById('stat-comments').textContent = cCount ?? 0
}

// ============================================================
// 用户列表
// ============================================================
async function loadUsers() {
  const box = document.getElementById('user-list')
  const { data, error } = await supabase
    .from('profiles')
    .select('id, username, role, rolling_wood, created_at')
    .order('created_at', { ascending: false })

  if (error || !data?.length) {
    box.innerHTML = `<div class="empty">暂无用户</div>`
    return
  }

  box.innerHTML = data.map(u => {
    const isAdmin = u.role === 'admin'
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:0.7rem;flex:1;min-width:0;">
            <div class="avatar">${escapeHtml(initial(u.username))}</div>
            <div style="min-width:0;">
              <div style="font-weight:600;color:var(--text-strong);">
                ${escapeHtml(u.username)}
                ${isAdmin ? '<span class="tag" style="margin-left:0.4rem;">管理员</span>' : ''}
              </div>
              <div style="font-size:0.78rem;color:var(--text-muted);">
                注册于 ${formatTime(u.created_at)} · 🪵 ${u.rolling_wood ?? 0}
              </div>
            </div>
          </div>
          ${u.id === me.id ? `<span style="font-size:0.8rem;color:var(--text-muted);">（你自己）</span>` : `
            <button class="btn btn-ghost btn-sm" data-toggle-role="${u.id}" data-current-role="${u.role}">
              ${isAdmin ? '取消管理员' : '设为管理员'}
            </button>
          `}
        </div>
      </div>
    `
  }).join('')

  bindCardGlow(box)
  box.querySelectorAll('[data-toggle-role]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.toggleRole
      const current = btn.dataset.currentRole
      const next = current === 'admin' ? 'user' : 'admin'
      if (!confirm(`确定将该用户角色改为「${next === 'admin' ? '管理员' : '普通用户'}」？`)) return
      const { error } = await supabase.from('profiles').update({ role: next }).eq('id', id)
      if (error) return alert(error.message)
      loadUsers()
    }
  })
}

// ============================================================
// 邀请码
// ============================================================
function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
  const seg = (n) => Array.from({ length: n }, () => chars[Math.floor(Math.random() * chars.length)]).join('')
  return `LR-${seg(4)}-${seg(4)}-${seg(4)}`
}

document.getElementById('gen-invite').onclick = async () => {
  const code = randomCode()
  const note = prompt('备注（可留空）：')
  if (note === null) return
  const { error } = await supabase.from('admin_invites').insert({ code, note })
  if (error) return alert(error.message)
  loadInvites()
  alert(`新邀请码：\n\n${code}\n\n请复制保存。`)
}

async function loadInvites() {
  const box = document.getElementById('invite-list')
  const { data, error } = await supabase
    .from('admin_invites')
    .select('code, created_at, used_at, note, used_by, is_permanent')
    .order('created_at', { ascending: false })

  if (error || !data?.length) {
    box.innerHTML = `<div class="empty">还没有邀请码</div>`
    return
  }

  box.innerHTML = data.map(inv => {
    const used = !!inv.used_by && !inv.is_permanent
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
          <div style="flex:1;min-width:0;">
            <div style="font-family:ui-monospace,monospace;font-size:1rem;font-weight:600;letter-spacing:0.05em;
                        color:${used ? 'var(--text-muted)' : 'var(--accent)'};${used ? 'text-decoration:line-through;' : ''}">
              ${escapeHtml(inv.code)}
              ${inv.is_permanent ? '<span class="tag" style="margin-left:0.4rem;">永久</span>' : ''}
            </div>
            <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.3rem;">
              ${inv.note ? escapeHtml(inv.note) + ' · ' : ''}${used ? `已于 ${formatTime(inv.used_at)} 使用` : '未使用'}
            </div>
          </div>
          ${used ? '' : `<button class="btn btn-ghost btn-sm" data-copy="${escapeHtml(inv.code)}">复制</button>`}
        </div>
      </div>
    `
  }).join('')

  bindCardGlow(box)
  box.querySelectorAll('[data-copy]').forEach(btn => {
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy)
        btn.textContent = '已复制 ✓'
        setTimeout(() => { btn.textContent = '复制' }, 1500)
      } catch (e) { prompt('复制失败，请手动复制：', btn.dataset.copy) }
    }
  })
}

// ============================================================
// 初始化
// ============================================================
loadAnnouncements()
loadStats()
loadPosts()
loadUsers()
loadInvites()
</script>
</body>
</html>
