<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>板块 · 老弱病残BBS</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lib/supabase-umd.js"></script>
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
</head>
<body>

<header class="main-header">
  <div class="header-inner">
    <a href="index.html" class="brand nav-logo">
      <span class="brand-name">老弱病残BBS</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="boards.html">全部帖子</a>
      <a href="new.html">发帖</a>
    </nav>
    <div class="header-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="nav-search" type="text" placeholder="搜索帖子…" autocomplete="off">
      <button id="search-clear" class="search-clear" type="button" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span id="nav-right" class="nav-right"></span>
    </div>
  </div>
</header>

<div class="page" style="max-width:1100px;">
  <div id="board-header"></div>
  <div id="posts"><div class="empty">加载中…</div></div>
  <div id="pagination" class="pagination"></div>
</div>

<script type="module">
import { supabase } from './assets/supabase.js'
import { renderNav, escapeHtml, formatTime, initial, bindCardGlow } from './assets/app.js'

renderNav()

const PAGE_SIZE = 8
const params = new URLSearchParams(location.search)
const tag = (params.get('tag') || '').trim()

const BOARDS = {
  '游戏': { icon: '🎮', desc: '游戏讨论、攻略、资源', color: 'linear-gradient(135deg, #a855f7, #ec4899)' },
  '工具': { icon: '🔧', desc: '效率工具、脚本、插件', color: 'linear-gradient(135deg, #14b8a6, #22d3ee)' },
  '软件': { icon: '💻', desc: '软件分享、教程、求助', color: 'linear-gradient(135deg, #6366f1, #8b5cf6)' },
  '其他': { icon: '📦', desc: '杂谈、闲聊、生活', color: 'linear-gradient(135deg, #f59e0b, #ef4444)' }
}

const board = BOARDS[tag]

const headerEl = document.getElementById('board-header')
const postsBox = document.getElementById('posts')
const paginationBox = document.getElementById('pagination')

let currentPage = 1
let currentTotal = 0

// ============ 页面头 ============
async function renderHeader() {
  if (!board) {
    headerEl.innerHTML = `<h1>未知板块</h1>`
    postsBox.innerHTML = `<div class="empty">板块「${escapeHtml(tag)}」不存在，<a href="index.html">返回首页</a></div>`
    paginationBox.innerHTML = ''
    return false
  }

  // 查板块帖子总数
  const { count } = await supabase
    .from('posts')
    .select('*', { count: 'exact', head: true })
    .contains('tags_major', [tag])

  currentTotal = count ?? 0

  headerEl.innerHTML = `
    <div class="board-detail-head">
      <div class="board-detail-icon" style="background:${board.color};">${board.icon}</div>
      <div style="flex:1;min-width:0;">
        <h1 class="board-detail-title">${escapeHtml(tag)}</h1>
        <p class="board-detail-desc">${escapeHtml(board.desc)} · 共 ${currentTotal} 篇</p>
      </div>
      <a href="new.html?tag=${encodeURIComponent(tag)}" class="btn btn-primary">✏️ 发帖</a>
    </div>
  `
  return true
}

// ============ 加载帖子（分页） ============
async function loadPosts(page = 1) {
  const totalPages = Math.max(1, Math.ceil(currentTotal / PAGE_SIZE))

  if (page < 1) page = 1
  if (page > totalPages) page = totalPages
  currentPage = page

  if (!currentTotal) {
    postsBox.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div>这个板块还没有帖子，<a href="new.html?tag=${encodeURIComponent(tag)}">来发第一帖</a>吧</div>
      </div>
    `
    paginationBox.innerHTML = ''
    return
  }

  postsBox.innerHTML = '<div class="empty">加载中…</div>'

  const from = (currentPage - 1) * PAGE_SIZE
  const to = from + PAGE_SIZE - 1

  const { data, error } = await supabase
    .from('posts')
    .select('id, title, content, created_at, tags_major, tags_minor, profiles!author_id(username), comments(count), likes(count), tips(count)')
    .contains('tags_major', [tag])
    .order('created_at', { ascending: false })
    .range(from, to)

  if (error) {
    postsBox.innerHTML = `<div class="empty">加载失败：${escapeHtml(error.message)}</div>`
    return
  }

  postsBox.innerHTML = data.map((p, i) => {
    const username = p.profiles?.username || '匿名'
    const cCount = p.comments?.[0]?.count ?? 0
    const lCount = p.likes?.[0]?.count ?? 0
    const tCount = p.tips?.[0]?.count ?? 0
    const majors = p.tags_major || []
    const minors = p.tags_minor || []

    const raw = String(p.content || '')
      .replace(/!\[[^\]]*\]\([^)]+\)/g, '[图片]')
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
      .replace(/[#*>`~_\-]/g, '')
      .replace(/\n+/g, ' ').trim()
    const summary = raw.slice(0, 140) + (raw.length > 140 ? '…' : '')

    return `
      <div class="card post-card" style="animation-delay:${Math.min(i * 55, 400)}ms;">
        <a href="post.html?id=${p.id}" class="post-link" aria-label="${escapeHtml(p.title)}"></a>
        <div class="card-head">
          <div class="avatar">${escapeHtml(initial(username))}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:0.85rem;color:var(--text-dim);font-weight:500;">${escapeHtml(username)}</div>
            <div style="font-size:0.78rem;color:var(--text-muted);">${formatTime(p.created_at)}</div>
          </div>
        </div>
        <h3>${escapeHtml(p.title)}</h3>
        ${(majors.length || minors.length) ? `
          <div class="post-tags">
            ${majors.map(t => `<a href="board.html?tag=${encodeURIComponent(t)}" class="tag-major">${escapeHtml(t)}</a>`).join('')}
            ${minors.map(t => `<a href="search.html?tag=${encodeURIComponent(t)}&type=minor" class="tag-minor">${escapeHtml(t)}</a>`).join('')}
          </div>
        ` : ''}
        ${summary ? `<div class="card-body">${escapeHtml(summary)}</div>` : ''}
        <div class="card-foot">
          <span class="stat">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            ${cCount}
          </span>
          <span class="stat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            ${lCount}
          </span>
          <span class="stat" title="收到滚木">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="8" width="18" height="4" rx="2"/>
              <path d="M5 12v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/>
            </svg>
            ${tCount}
          </span>
          <span class="stat" style="color:var(--primary-light);margin-left:auto;">查看 →</span>
        </div>
      </div>
    `
  }).join('')

  bindCardGlow(postsBox)
  renderPagination(totalPages)
}

// ============ 分页渲染 ============
function renderPagination(totalPages) {
  if (totalPages <= 1) {
    paginationBox.innerHTML = ''
    return
  }

  const parts = []
  parts.push(`<button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>← 上一页</button>`)

  const pages = []
  const maxShow = 7
  let start = Math.max(1, currentPage - Math.floor(maxShow / 2))
  let end = Math.min(totalPages, start + maxShow - 1)
  if (end - start + 1 < maxShow) start = Math.max(1, end - maxShow + 1)

  if (start > 1) {
    pages.push(1)
    if (start > 2) pages.push('…')
  }
  for (let i = start; i <= end; i++) pages.push(i)
  if (end < totalPages) {
    if (end < totalPages - 1) pages.push('…')
    pages.push(totalPages)
  }

  pages.forEach(p => {
    if (p === '…') {
      parts.push(`<span class="page-ellipsis">…</span>`)
    } else {
      parts.push(`<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`)
    }
  })

  parts.push(`<button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>下一页 →</button>`)

  paginationBox.innerHTML = parts.join('')

  paginationBox.querySelectorAll('.page-btn').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.page
      let newPage = currentPage
      if (target === 'prev') newPage = Math.max(1, currentPage - 1)
      else if (target === 'next') newPage = Math.min(totalPages, currentPage + 1)
      else newPage = Number(target)

      if (newPage === currentPage) return

      loadPosts(newPage)
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  })
}

// ============ 初始化 ============
async function init() {
  const ok = await renderHeader()
  if (!ok) return
  loadPosts(1)
}

init()
</script>
</body>
</html>
