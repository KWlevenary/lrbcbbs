<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>发帖 · 老弱病残BBS</title>
<link rel="stylesheet" href="assets/style.css">
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
</head>
<body>

<header class="main-header">
  <div class="header-inner">
    <a href="index.html" class="brand nav-logo">
      <span class="brand-name">老弱病残BBS</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="boards.html">全部帖子</a>
      <a href="new.html" class="active">发帖</a>
    </nav>
    <div class="header-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="nav-search" type="text" placeholder="搜索帖子…" autocomplete="off">
      <button id="search-clear" class="search-clear" type="button" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span id="nav-right" class="nav-right"></span>
    </div>
  </div>
</header>

<div class="page" style="max-width:1200px;">
  <h1>发新帖</h1>
  <div id="msg" class="msg" style="display:none;"></div>

  <div class="card" style="padding:1.8rem;">
    <form id="form">
      <div class="form-group">
        <label>标题</label>
        <input id="title" type="text" required maxlength="100" placeholder="一句话说清楚">
      </div>

      <div class="form-group">
        <label>板块（必选一个）</label>
        <div class="board-selector" id="board-selector">
          <button type="button" class="board-option" data-value="游戏">
            <span class="board-option-icon">🎮</span>
            <span class="board-option-name">游戏</span>
          </button>
          <button type="button" class="board-option" data-value="工具">
            <span class="board-option-icon">🔧</span>
            <span class="board-option-name">工具</span>
          </button>
          <button type="button" class="board-option" data-value="软件">
            <span class="board-option-icon">💻</span>
            <span class="board-option-name">软件</span>
          </button>
          <button type="button" class="board-option" data-value="其他">
            <span class="board-option-icon">📦</span>
            <span class="board-option-name">其他</span>
          </button>
        </div>
        <input type="hidden" id="tags-major" value="">
      </div>

      <div class="form-group">
        <label>小标签（可选，最多 5 个，用逗号分隔）</label>
        <input id="tags-minor" type="text" placeholder="埃及吧填啥填啥" maxlength="100">
      </div>

      <div class="form-group">
        <label>正文（支持 Markdown 与链接卡片）</label>
        <div class="editor-toolbar">
          <button type="button" data-insert="bold" title="粗体">B</button>
          <button type="button" data-insert="italic" title="斜体" style="font-style:italic;">I</button>
          <button type="button" data-insert="strike" title="删除线" style="text-decoration:line-through;">S</button>
          <button type="button" data-insert="h2" title="标题">H</button>
          <button type="button" data-insert="quote" title="引用">❝</button>
          <button type="button" data-insert="code" title="行内代码">&lt;/&gt;</button>
          <button type="button" data-insert="ul" title="无序列表">•</button>
          <button type="button" data-insert="link" title="普通链接">🔗</button>
          <button type="button" id="insert-link-card-btn" title="插入链接卡片（醒目）" style="color:#22d3ee;">📥</button>
          <button type="button" id="upload-image-btn" title="上传图片">🖼️</button>
          <input type="file" id="image-file-input" accept="image/*" multiple style="display:none;">
          <span class="toolbar-spacer"></span>
          <button type="button" class="tab-btn active" data-tab="edit">编辑</button>
          <button type="button" class="tab-btn" data-tab="preview">预览</button>
        </div>
        <textarea id="content" required></textarea>
        <div id="upload-status" class="upload-status" style="display:none;"></div>
        <div id="preview" class="post-content preview-box" style="display:none;"></div>
      </div>

      <div style="display:flex;gap:1rem;flex-wrap:wrap;">
        <button type="submit" class="btn btn-primary" id="submit-btn">发布</button>
        <a href="index.html" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</div>

<!-- ============ 链接卡片弹窗 ============ -->
<div class="lc-modal-mask" id="lc-modal" style="display:none;">
  <div class="lc-modal">
    <h3 class="lc-modal-title">🔗 插入链接卡片</h3>
    <p class="lc-modal-sub">让下载链接在帖子里更醒目</p>

    <div class="form-group">
      <label>链接地址 *</label>
      <input id="lc-url" type="url" placeholder="https://..." maxlength="500">
    </div>

    <div class="form-group">
      <label>卡片标题 *</label>
      <input id="lc-title" type="text" placeholder="如：点击下载" maxlength="50">
    </div>

    <div class="form-group">
      <label>描述（可选）</label>
      <input id="lc-desc" type="text" placeholder="如：123网盘，免登录下载" maxlength="80">
    </div>

    <div class="form-group">
      <label>图标</label>
      <div class="lc-icons">
        <button type="button" class="lc-icon-btn selected" data-icon="📥">📥</button>
        <button type="button" class="lc-icon-btn" data-icon="🔗">🔗</button>
        <button type="button" class="lc-icon-btn" data-icon="📄">📄</button>
        <button type="button" class="lc-icon-btn" data-icon="🎮">🎮</button>
        <button type="button" class="lc-icon-btn" data-icon="🎬">🎬</button>
        <button type="button" class="lc-icon-btn" data-icon="🎵">🎵</button>
        <button type="button" class="lc-icon-btn" data-icon="📦">📦</button>
        <button type="button" class="lc-icon-btn" data-icon="💻">💻</button>
        <button type="button" class="lc-icon-btn" data-icon="🌐">🌐</button>
        <button type="button" class="lc-icon-btn" data-icon="⚡">⚡</button>
      </div>
    </div>

    <div class="form-group">
      <label>颜色</label>
      <div class="lc-colors">
        <button type="button" class="lc-color-btn selected" data-color="blue" style="background:#3b82f6;"></button>
        <button type="button" class="lc-color-btn" data-color="green" style="background:#22c55e;"></button>
        <button type="button" class="lc-color-btn" data-color="purple" style="background:#a855f7;"></button>
        <button type="button" class="lc-color-btn" data-color="orange" style="background:#f59e0b;"></button>
        <button type="button" class="lc-color-btn" data-color="red" style="background:#ef4444;"></button>
        <button type="button" class="lc-color-btn" data-color="cyan" style="background:#06b6d4;"></button>
      </div>
    </div>

    <div class="form-group">
      <label>预览</label>
      <div class="lc-preview" id="lc-preview"></div>
    </div>

    <div class="lc-actions">
      <button type="button" class="btn btn-ghost" id="lc-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="lc-confirm">插入</button>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from './assets/supabase.js'
import { $, $$, showMsg, renderNav, requireLogin } from './assets/app.js'
import { marked } from 'https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js'
import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.mjs'
import imageCompression from 'https://cdn.jsdelivr.net/npm/browser-image-compression@2/dist/browser-image-compression.mjs'

renderNav()
const user = await requireLogin()
if (!user) throw new Error('redirecting')

marked.setOptions({ breaks: true, gfm: true })

const contentEl = $('#content')
const previewEl = $('#preview')
const statusEl = $('#upload-status')
const boardInput = $('#tags-major')

// ============ HTML 转义 ============
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
}

// ============ Markdown 渲染（含链接卡片） ============
function renderMd(text) {
  if (!text) return ''

  const cards = []
  text = text.replace(/\[\[CARD:([^|]+)\|([^|]+)\|([^|]*)\|([^|]+)\|([^|]+)\]\]/g,
    (m, url, title, desc, icon, color) => {
      const idx = cards.length
      cards.push({
        url: url.trim(),
        title: title.trim(),
        desc: desc.trim(),
        icon: icon.trim(),
        color: ['blue','green','purple','orange','red','cyan'].includes(color.trim()) ? color.trim() : 'blue'
      })
      return `%%CARD_${idx}%%`
    })

  let html = DOMPurify.sanitize(marked.parse(text), {
    ADD_ATTR: ['target', 'rel']
  })

  const buildCard = (c) => `<a class="link-card link-card-${c.color}" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer nofollow">
    <div class="link-card-icon">${esc(c.icon)}</div>
    <div class="link-card-body">
      <div class="link-card-title">${esc(c.title)}</div>
      ${c.desc ? `<div class="link-card-desc">${esc(c.desc)}</div>` : ''}
    </div>
    <div class="link-card-arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </a>`

  html = html.replace(/<p>\s*%%CARD_(\d+)%%\s*<\/p>/g, (m, idx) => buildCard(cards[Number(idx)]) || '')
  html = html.replace(/%%CARD_(\d+)%%/g, (m, idx) => buildCard(cards[Number(idx)]) || '')

  return html
}

// ============ 板块选择 ============
const urlTag = new URLSearchParams(location.search).get('tag')
const selector = document.getElementById('board-selector')

function selectBoard(tag) {
  boardInput.value = tag
  selector.querySelectorAll('.board-option').forEach(b => {
    b.classList.toggle('selected', b.dataset.value === tag)
  })
}

selector.querySelectorAll('.board-option').forEach(btn => {
  btn.onclick = () => selectBoard(btn.dataset.value)
})

const validTags = ['游戏', '工具', '软件', '其他']
if (urlTag && validTags.includes(urlTag)) selectBoard(urlTag)
else selectBoard('其他')

// ============ 状态提示 ============
function setStatus(text, type = 'info') {
  if (!text) { statusEl.style.display = 'none'; return }
  statusEl.style.display = 'block'
  statusEl.textContent = text
  statusEl.className = 'upload-status ' + type
}

// ============ 工具栏：插入语法 ============
function insertSyntax(before, after = '', placeholder = '') {
  const ta = contentEl
  const start = ta.selectionStart
  const end = ta.selectionEnd
  const selected = ta.value.slice(start, end)
  const body = selected || placeholder
  const insert = before + body + after
  ta.setRangeText(insert, start, start + (end - start), 'end')
  if (!selected && placeholder) {
    ta.setSelectionRange(start + before.length, start + before.length + placeholder.length)
  }
  ta.focus()
}

const INSERTS = {
  bold:   () => insertSyntax('**', '**', '粗体'),
  italic: () => insertSyntax('*', '*', '斜体'),
  strike: () => insertSyntax('~~', '~~', '删除线'),
  h2:     () => insertSyntax('## ', '', '标题'),
  quote:  () => insertSyntax('> ', '', '引用内容'),
  code:   () => insertSyntax('`', '`', '代码'),
  ul:     () => insertSyntax('- ', '', '列表项'),
  link:   () => {
    const url = prompt('链接地址：', 'https://')
    if (!url) return
    const text = prompt('显示文字：', url) || url
    insertSyntax(`[${text}](${url})`)
  }
}

$$('.editor-toolbar [data-insert]').forEach(btn => {
  btn.onclick = () => { const fn = INSERTS[btn.dataset.insert]; if (fn) fn() }
})

// ============ 链接卡片弹窗 ============
const lcModal = document.getElementById('lc-modal')
const lcUrlInput = document.getElementById('lc-url')
const lcTitleInput = document.getElementById('lc-title')
const lcDescInput = document.getElementById('lc-desc')
const lcPreviewEl = document.getElementById('lc-preview')
let lcIcon = '📥'
let lcColor = 'blue'

function openLinkCardModal() {
  lcModal.style.display = 'flex'
  setTimeout(() => lcUrlInput.focus(), 100)
  updateLcPreview()
}

function closeLinkCardModal() {
  lcModal.style.display = 'none'
  lcUrlInput.value = ''
  lcTitleInput.value = ''
  lcDescInput.value = ''
  lcIcon = '📥'
  lcColor = 'blue'
  document.querySelectorAll('.lc-icon-btn').forEach((b, i) => b.classList.toggle('selected', i === 0))
  document.querySelectorAll('.lc-color-btn').forEach((b, i) => b.classList.toggle('selected', i === 0))
  updateLcPreview()
}

function updateLcPreview() {
  const url = lcUrlInput.value.trim() || 'https://example.com'
  const title = lcTitleInput.value.trim() || '链接标题'
  const desc = lcDescInput.value.trim()
  lcPreviewEl.innerHTML = `
    <a class="link-card link-card-${lcColor}" href="javascript:void(0)" tabindex="-1">
      <div class="link-card-icon">${esc(lcIcon)}</div>
      <div class="link-card-body">
        <div class="link-card-title">${esc(title)}</div>
        ${desc ? `<div class="link-card-desc">${esc(desc)}</div>` : ''}
      </div>
      <div class="link-card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </div>
    </a>
  `
}

document.getElementById('insert-link-card-btn').onclick = openLinkCardModal
document.getElementById('lc-cancel').onclick = closeLinkCardModal
lcModal.onclick = (e) => { if (e.target === lcModal) closeLinkCardModal() }

lcUrlInput.oninput = updateLcPreview
lcTitleInput.oninput = updateLcPreview
lcDescInput.oninput = updateLcPreview

document.querySelectorAll('.lc-icon-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lc-icon-btn').forEach(b => b.classList.remove('selected'))
    btn.classList.add('selected')
    lcIcon = btn.dataset.icon
    updateLcPreview()
  }
})

document.querySelectorAll('.lc-color-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lc-color-btn').forEach(b => b.classList.remove('selected'))
    btn.classList.add('selected')
    lcColor = btn.dataset.color
    updateLcPreview()
  }
})

document.getElementById('lc-confirm').onclick = () => {
  const url = lcUrlInput.value.trim()
  const title = lcTitleInput.value.trim()
  const desc = lcDescInput.value.trim()
  if (!url) return alert('请输入链接地址')
  if (!title) return alert('请输入卡片标题')
  if (url.includes('|')) return alert('链接中不能包含竖线 |')

  const syntax = `\n[[CARD:${url}|${title}|${desc}|${lcIcon}|${lcColor}]]\n`
  insertSyntax(syntax)
  closeLinkCardModal()
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lcModal.style.display === 'flex') closeLinkCardModal()
})

// ============ 编辑/预览切换 ============
$$('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    $$('.tab-btn').forEach(x => x.classList.remove('active'))
    btn.classList.add('active')
    if (btn.dataset.tab === 'edit') {
      contentEl.style.display = ''
      previewEl.style.display = 'none'
    } else {
      const html = renderMd(contentEl.value)
      previewEl.innerHTML = html || '<p style="color:var(--text-muted);">暂无内容</p>'
      contentEl.style.display = 'none'
      previewEl.style.display = ''
    }
  }
})

// ============ 图片压缩上传 ============
const BUCKET = 'post-images'
const MAX_SIZE = 10 * 1024 * 1024
const COMPRESS_THRESHOLD = 500 * 1024
const MAX_DIMENSION = 1920

async function compressIfNeeded(file) {
  if (file.size <= COMPRESS_THRESHOLD) return { file, compressed: false, saved: 0 }
  const originalSize = file.size
  try {
    const compressed = await imageCompression(file, {
      maxWidthOrHeight: MAX_DIMENSION,
      useWebWorker: true,
      initialQuality: 0.8,
      fileType: 'image/webp',
      maxSizeMB: 2,
      onProgress: (p) => setStatus(`压缩中… ${Math.round(p)}%`, 'info')
    })
    if (compressed.size >= originalSize) return { file, compressed: false, saved: 0 }
    const newName = file.name.replace(/\.[^.]+$/, '') + '.webp'
    return { file: new File([compressed], newName, { type: 'image/webp' }), compressed: true, saved: originalSize - compressed.size }
  } catch (err) { return { file, compressed: false, saved: 0 } }
}

async function uploadImage(file) {
  if (!file.type.startsWith('image/')) throw new Error('不是图片文件')
  if (file.size > MAX_SIZE) throw new Error(`图片超过 ${MAX_SIZE / 1024 / 1024}MB`)
  setStatus('处理中…', 'info')
  const result = await compressIfNeeded(file)
  const uploadFile = result.file
  if (result.compressed) {
    const savedKB = Math.round(result.saved / 1024)
    const newKB = Math.round(uploadFile.size / 1024)
    setStatus(`已压缩，省 ${savedKB} KB（现 ${newKB} KB）`, 'success')
  }
  const ext = (uploadFile.name.split('.').pop() || 'png').toLowerCase()
  const rand = Math.random().toString(36).slice(2, 8)
  const path = `${user.id}/${Date.now()}-${rand}.${ext}`
  const { error } = await supabase.storage.from(BUCKET).upload(path, uploadFile, {
    cacheControl: '3600', upsert: false, contentType: uploadFile.type
  })
  if (error) throw error
  const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(path)
  return urlData.publicUrl
}

async function uploadAndInsert(file) {
  const name = file.name || 'image'
  const safeName = name.length > 14 ? name.slice(0, 14) + '…' : name
  try {
    setStatus(`处理 ${safeName}…`, 'info')
    const url = await uploadImage(file)
    const alt = (file.name || 'image').replace(/\.[^.]+$/, '')
    insertSyntax(`![${alt}](${url})\n`)
    setStatus(`✓ ${safeName} 上传完成`, 'success')
    setTimeout(() => setStatus(''), 1800)
  } catch (err) {
    setStatus(`✗ ${safeName}：${err.message}`, 'error')
    setTimeout(() => setStatus(''), 3500)
  }
}

const uploadBtn = document.getElementById('upload-image-btn')
const fileInput = document.getElementById('image-file-input')
uploadBtn.onclick = () => fileInput.click()
fileInput.onchange = async () => {
  const files = Array.from(fileInput.files || [])
  if (!files.length) return
  uploadBtn.disabled = true
  const orig = uploadBtn.textContent
  for (const file of files) { uploadBtn.textContent = '…'; await uploadAndInsert(file) }
  uploadBtn.disabled = false
  uploadBtn.textContent = orig
  fileInput.value = ''
}

contentEl.addEventListener('paste', async (e) => {
  const items = Array.from(e.clipboardData?.items || [])
  const imageItems = items.filter(it => it.type.startsWith('image/'))
  if (!imageItems.length) return
  e.preventDefault()
  for (const item of imageItems) {
    const file = item.getAsFile()
    if (file) {
      if (!file.name || file.name === 'image.png') {
        const ext = (file.type.split('/')[1] || 'png').toLowerCase()
        Object.defineProperty(file, 'name', { value: `pasted-${Date.now()}.${ext}`, writable: false })
      }
      await uploadAndInsert(file)
    }
  }
})

let dragDepth = 0
contentEl.addEventListener('dragenter', (e) => {
  e.preventDefault(); dragDepth++
  contentEl.style.borderColor = 'var(--primary)'
  contentEl.style.boxShadow = '0 0 0 4px rgba(20, 184, 166, 0.12)'
})
contentEl.addEventListener('dragover', (e) => e.preventDefault())
contentEl.addEventListener('dragleave', () => {
  dragDepth--
  if (dragDepth <= 0) { dragDepth = 0; contentEl.style.borderColor = ''; contentEl.style.boxShadow = '' }
})
contentEl.addEventListener('drop', async (e) => {
  e.preventDefault()
  dragDepth = 0
  contentEl.style.borderColor = ''
  contentEl.style.boxShadow = ''
  const files = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/'))
  for (const file of files) await uploadAndInsert(file)
})

// ============ 提交 ============
$('#form').onsubmit = async (e) => {
  e.preventDefault()
  const majorTag = boardInput.value
  if (!majorTag) { showMsg($('#msg'), '请选择一个板块', 'error'); return }

  const btn = $('#submit-btn')
  btn.disabled = true
  const orig = btn.textContent
  btn.textContent = '发布中…'

  const tagsMinor = String($('#tags-minor').value || '')
    .split(/[,，]/).map(t => t.trim()).filter(Boolean).slice(0, 5)

  const { data, error } = await supabase
    .from('posts')
    .insert({
      author_id: user.id,
      title: $('#title').value.trim(),
      content: contentEl.value.trim(),
      tags_major: [majorTag],
      tags_minor: tagsMinor
    })
    .select('id')
    .single()

  if (error) {
    showMsg($('#msg'), error.message, 'error')
    btn.disabled = false
    btn.textContent = orig
    return
  }

  showMsg($('#msg'), '发布成功，正在跳转…', 'success')
  setTimeout(() => { location.href = `post.html?id=${data.id}` }, 500)
}
</script>
</body>
</html>
