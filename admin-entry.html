<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>·</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lib/supabase-umd.js"></script>
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
</head>
<body>

<nav class="main-header">
  <div class="header-inner">
    <a href="index.html" class="brand nav-logo">
      <span class="brand-name">老弱病残BBS</span>
    </a>
    <div style="flex:1;"></div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<div class="page" style="max-width:420px;padding-top:4rem;">
  <div class="card" style="padding:2rem;">
    <h2 style="margin-bottom:0.5rem;">管理员邀请码</h2>
    <p style="color:var(--text-dim);font-size:0.9rem;margin-bottom:1.5rem;">
      输入有效邀请码，即可将当前账号升级为管理员。
    </p>

    <div id="msg" class="msg" style="display:none;"></div>

    <form id="form">
      <div class="form-group">
        <label>邀请码</label>
        <input id="code" type="text" required placeholder="XXXX-XXXX-XXXX-XXXX"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               style="font-family:ui-monospace,monospace;letter-spacing:0.05em;">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">
        验证并升级
      </button>
    </form>

    <p style="text-align:center;margin-top:1.2rem;font-size:0.85rem;">
      <a href="index.html" style="color:var(--text-muted);">← 返回首页</a>
    </p>
  </div>
</div>

<script type="module">
import { supabase } from './assets/supabase.js'
import { $, showMsg, initTheme, getUser } from './assets/app.js'

initTheme()

const user = await getUser()
if (!user) {
  const redirect = encodeURIComponent(location.pathname)
  location.href = 'login.html?redirect=' + redirect
  throw new Error('redirecting')
}

const { data: meProfile } = await supabase
  .from('profiles')
  .select('role')
  .eq('id', user.id)
  .single()

if (meProfile && meProfile.role === 'admin') {
  location.href = 'admin.html'
  throw new Error('already admin')
}

$('#form').onsubmit = async (e) => {
  e.preventDefault()
  const btn = $('#submit-btn')
  btn.disabled = true
  const orig = btn.textContent
  btn.textContent = '验证中…'

  const code = $('#code').value.trim()

  const { data, error } = await supabase.rpc('redeem_admin_invite', {
    input_code: code
  })

  if (error) {
    showMsg($('#msg'), error.message || '请求失败', 'error')
    btn.disabled = false
    btn.textContent = orig
    return
  }

  if (!data || !data.success) {
    showMsg($('#msg'), (data && data.error) || '邀请码无效', 'error')
    btn.disabled = false
    btn.textContent = orig
    return
  }

  showMsg($('#msg'), '升级成功，正在进入管理面板…', 'success')
  setTimeout(() => { location.href = 'admin.html' }, 900)
}
</script>
</body>
</html>
