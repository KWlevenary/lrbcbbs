<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<title>消息通知 · 老弱病残BBS</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lib/supabase-umd.js"></script>
<script>
  (function () {
    try {
      const saved = localStorage.getItem('theme')
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    } catch (e) {}
  })()
</script>
</head>
<body>

<header class="main-header">
  <div class="header-inner">
    <a href="index.html" class="brand nav-logo">
      <span class="brand-name">老弱病残BBS</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">论坛</a>
      <a href="new.html">发帖</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <span id="nav-right" class="nav-right"></span>
    </div>
  </div>
</header>

<div class="page" style="max-width:900px;">
  <h1 style="margin-bottom:1rem;">消息通知</h1>

  <div class="profile-tabs">
    <button class="profile-tab active" data-tab="replies">收到的回复</button>
    <button class="profile-tab" data-tab="likes">收到的赞</button>
  </div>

  <div id="content"><div class="empty">加载中…</div></div>
</div>

<script type="module">
import { supabase } from './assets/supabase.js'
import {
  $, $$, escapeHtml, formatTime, renderNav, requireLogin, initial, bindCardGlow
} from './assets/app.js'

renderNav()
const user = await requireLogin()
if (!user) throw new Error('redirecting')

// ============ Tab 切换 ============
const initialTab = new URLSearchParams(location.search).get('tab') || 'replies'
$$('.profile-tab').forEach(btn => {
  if (btn.dataset.tab === initialTab) btn.classList.add('active')
  else btn.classList.remove('active')

  btn.onclick = () => {
    $$('.profile-tab').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    history.replaceState(null, '', `?tab=${btn.dataset.tab}`)
    loadTab(btn.dataset.tab)
  }
})

// ============ 工具：消息卡片 ============
function messageCard({ href, avatarName, headerHtml, contentHtml, time }) {
  return `
    <a href="${href}" class="msg-card">
      <div class="msg-avatar">${escapeHtml(initial(avatarName))}</div>
      <div class="msg-body">
        <div class="msg-header">${headerHtml}</div>
        ${contentHtml ? `<div class="msg-preview">${contentHtml}</div>` : ''}
      </div>
      <div class="msg-time">${formatTime(time)}</div>
    </a>
  `
}

// ============ Tab 1：收到的回复 ============
async function loadReplies() {
  const box = $('#content')
  box.innerHTML = '<div class="empty">加载中…</div>'

  // 1. 我发的帖子
  const { data: myPosts } = await supabase
    .from('posts').select('id, title').eq('author_id', user.id)
  const myPostIds = (myPosts || []).map(p => p.id)
  const postTitleMap = {}
  ;(myPosts || []).forEach(p => { postTitleMap[p.id] = p.title })

  // 2. 我发的评论
  const { data: myComments } = await supabase
    .from('comments').select('id, post_id, content').eq('author_id', user.id)
  const myCommentIds = (myComments || []).map(c => c.id)
  const commentContentMap = {}
  ;(myComments || []).forEach(c => { commentContentMap[c.id] = c.content })

  // 3. 别人评论我的帖子
  let postComments = []
  if (myPostIds.length) {
    const { data } = await supabase
      .from('comments')
      .select('id, content, created_at, post_id, parent_id, author_id, profiles!author_id(username)')
      .in('post_id', myPostIds)
      .is('parent_id', null)
      .neq('author_id', user.id)
      .order('created_at', { ascending: false })
      .limit(100)
    postComments = data || []
  }

  // 4. 别人回复我的评论
  let commentReplies = []
  if (myCommentIds.length) {
    const { data } = await supabase
      .from('comments')
      .select('id, content, created_at, post_id, parent_id, author_id, profiles!author_id(username)')
      .in('parent_id', myCommentIds)
      .neq('author_id', user.id)
      .order('created_at', { ascending: false })
      .limit(100)
    commentReplies = data || []
  }

  // 合并、去重、排序
  const all = [
    ...postComments.map(c => ({ ...c, _type: 'post' })),
    ...commentReplies.map(c => ({ ...c, _type: 'comment' }))
  ]
  const seen = new Set()
  const merged = []
  for (const c of all) {
    if (seen.has(c.id)) continue
    seen.add(c.id)
    merged.push(c)
  }
  merged.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))

  if (!merged.length) {
    box.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div>还没有收到回复</div>
      </div>
    `
    return
  }

  box.innerHTML = merged.map(c => {
    const cname = c.profiles?.username || '匿名'
    const postTitle = postTitleMap[c.post_id] || '一个帖子'

    let header, link
    if (c._type === 'post') {
      header = `<strong>${escapeHtml(cname)}</strong> 评论了你的帖子 <span class="msg-target">「${escapeHtml(postTitle)}」</span>`
      link = `post.html?id=${c.post_id}`
    } else {
      header = `<strong>${escapeHtml(cname)}</strong> 回复了你在 <span class="msg-target">「${escapeHtml(postTitle)}」</span> 中的评论`
      link = `post.html?id=${c.post_id}#comment-${c.id}`
    }

    return messageCard({
      href: link,
      avatarName: cname,
      headerHtml: header,
      contentHtml: escapeHtml(c.content.slice(0, 100)) + (c.content.length > 100 ? '…' : ''),
      time: c.created_at
    })
  }).join('')
}

// ============ Tab 2：收到的赞 ============
async function loadLikes() {
  const box = $('#content')
  box.innerHTML = '<div class="empty">加载中…</div>'

  // 我的帖子
  const { data: myPosts } = await supabase
    .from('posts').select('id, title').eq('author_id', user.id)
  const myPostIds = (myPosts || []).map(p => p.id)

  if (!myPostIds.length) {
    box.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <div>还没有收到赞</div>
      </div>
    `
    return
  }

  const { data, error } = await supabase
    .from('likes')
    .select('created_at, user_id, post_id, profiles!user_id(username)')
    .in('post_id', myPostIds)
    .neq('user_id', user.id)
    .order('created_at', { ascending: false })
    .limit(100)

  if (error) {
    box.innerHTML = `<div class="empty">加载失败：${escapeHtml(error.message)}</div>`
    return
  }

  const postTitleMap = {}
  ;(myPosts || []).forEach(p => { postTitleMap[p.id] = p.title })

  if (!data?.length) {
    box.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <div>还没有收到赞</div>
      </div>
    `
    return
  }

  box.innerHTML = data.map(lk => {
    const lname = lk.profiles?.username || '匿名'
    const postTitle = postTitleMap[lk.post_id] || '你的帖子'

    return messageCard({
      href: `post.html?id=${lk.post_id}`,
      avatarName: lname,
      headerHtml: `<strong>${escapeHtml(lname)}</strong> 赞了你的帖子 <span class="msg-target">「${escapeHtml(postTitle)}」</span>`,
      contentHtml: '',
      time: lk.created_at
    })
  }).join('')
}

// ============ 加载 Tab ============
async function loadTab(t) {
  if (t === 'replies') await loadReplies()
  else if (t === 'likes') await loadLikes()
}

loadTab(initialTab)
</script>
</body>
</html>
